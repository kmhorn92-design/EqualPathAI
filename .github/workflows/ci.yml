name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: equalpath, POSTGRES_PASSWORD: equalpath, POSTGRES_DB: equalpath }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://equalpath:equalpath@localhost:5432/equalpath
      DIRECT_URL: postgresql://equalpath:equalpath@localhost:5432/equalpath
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'dGVzdC1rZXktdGVzdC1rZXktdGVzdC1rZXktMzJieXQ=' }}
      CRON_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
